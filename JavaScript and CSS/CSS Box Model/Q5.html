<!DOCTYPE html>
<html>
<head>
    <title>Padding Properties</title>

    <style>
        #p1 {
            padding-left: 3cm;
        }

        #p2 {
            padding-right: 50%;
        }

        #p3 {
            padding-bottom: 25%;
        }

        #p4 {
            padding-top: 25%;
        }
    </style>
</head>

<body>

    <p id="p1">
        This is the first paragraph.
    </p>

    <p id="p2">
        This is the second paragraph.
    </p>

    <p id="p3">
        This is the third paragraph.
    </p>

    <p id="p4">
        This is the fourth paragraph.
    </p>

</body>
</html>
