<!DOCTYPE html>
<html>
<head>
    <title>Different Margins</title>

    <style>
        #p1 {
            margin-top: 3cm;
            margin-bottom: 5cm;
        }

        #p2 {
            margin-left: 2cm;
        }

        #p3 {
            margin-top: 25%;
        }
    </style>
</head>

<body>

    <p id="p1">
        This is the first paragraph.
    </p>

    <p id="p2">
        This is the second paragraph.
    </p>

    <p id="p3">
        This is the third paragraph.
    </p>

</body>
</html>
