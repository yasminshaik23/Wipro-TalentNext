<!DOCTYPE html>
<html>
<head>
    <title>Uppercase on Blur</title>
</head>
<body>

    <input type="text" id="textBox" onblur="convertToUppercase()">

    <script>
        function convertToUppercase() {
            let input = document.getElementById("textBox");

            input.value = input.value.toUpperCase();
        }
    </script>

</body>
</html>
