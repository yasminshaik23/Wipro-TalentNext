<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

    <h2 align="center">
        <font color="blue">Account Login</font>
    </h2>

    <form>

        <table border="1" align="center">

            <tr>
                <td><b>User Name:</b></td>
                <td>
                    <input type="text"
                           name="username"
                           maxlength="8"
                           size="8">
                </td>
            </tr>

            <tr>
                <td><b>Password:</b></td>
                <td>
                    <input type="password"
                           name="password"
                           maxlength="8"
                           size="8">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Login">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
