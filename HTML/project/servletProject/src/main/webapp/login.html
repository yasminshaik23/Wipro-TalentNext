<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
</head>

<body>

<center>

    <h2>Login Page</h2>

    <form action="login" method="post">

        <table cellpadding="5">

            <tr>
                <td>User ID:</td>
                <td>
                    <input type="text"
                           name="userid"
                           required>
                </td>
            </tr>

            <tr>
                <td>Password:</td>
                <td>
                    <input type="password"
                           name="password"
                           required>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit"
                           value="Login">
                </td>
            </tr>

        </table>

    </form>

    <br>

    <a href="registration.html">
        New User
    </a>

</center>

</body>

</html>
