<!DOCTYPE html>
<html>
<head>
    <title>Forms using Div Tags</title>
</head>

<body>

    <!-- Form 2: Visitor Information -->
    <div>

        <h2>Visitors Information</h2>
        <hr>

        <form>

            <table>

                <tr>
                    <td>Email address:</td>
                    <td>
                        <input type="text" name="email">
                    </td>
                </tr>

                <tr>
                    <td>User's interest:</td>
                    <td>
                        <input type="checkbox" name="interest" value="research">
                        Research

                        <input type="checkbox" name="interest" value="purchase">
                        Purchase
                    </td>
                </tr>

                <tr>
                    <td>Occupation:</td>
                    <td>
                        <select name="occupation">
                            <option selected>Select one</option>
                            <option>Student</option>
                            <option>Employee</option>
                            <option>Business</option>
                            <option>Teacher</option>
                            <option>Other</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Want us to send you junk emails?</td>
                    <td>
                        <input type="radio" name="junk" value="absolutely">
                        absolutely

                        <input type="radio" name="junk" value="no">
                        no way man
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </div>


    <br>
    <hr>
    <br>


    <!-- Form 3: Online Registration -->
    <div>

        <h2>Online Registration Form</h2>

        <form>

            <table>

                <tr>
                    <td>Username:</td>
                    <td>
                        <input type="text" name="username">
                    </td>
                </tr>

                <tr>
                    <td>Password:</td>
                    <td>
                        <input type="password" name="password">
                    </td>
                </tr>

                <tr>
                    <td>Confirm Password:</td>
                    <td>
                        <input type="password" name="confirmPassword">
                    </td>
                </tr>

                <tr>
                    <td>Name:</td>
                    <td>
                        <input type="text" name="name">
                    </td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender" value="male">
                        Male

                        <input type="radio" name="gender" value="female">
                        Female
                    </td>
                </tr>

                <tr>
                    <td>Address:</td>
                    <td>
                        <textarea name="address" rows="5" cols="25"></textarea>
                    </td>
                </tr>

                <tr>
                    <td>Profession:</td>
                    <td>
                        <select name="profession">
                            <option selected>Select</option>
                            <option>Student</option>
                            <option>Teacher</option>
                            <option>Engineer</option>
                            <option>Doctor</option>
                            <option>Other</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="submit" value="Register">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </div>

</body>
</html>
