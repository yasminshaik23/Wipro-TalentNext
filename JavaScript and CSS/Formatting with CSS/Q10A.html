<!DOCTYPE html>
<html>
<head>
    <title>Image Border Repeat</title>

    <style>
        div {
            border: 20px solid transparent;
            border-image-source: url("sky.png");
            border-image-slice: 30;
            border-image-repeat: repeat;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div>
        Welcome to CSS World
    </div>

</body>
</html>
