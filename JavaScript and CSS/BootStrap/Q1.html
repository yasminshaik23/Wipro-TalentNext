<!DOCTYPE html>
<html>
<head>
    <title>Responsive Images</title>

    <style>
        img {
            width: 100%;
            height: auto;
        }

        #img2, #img3, #img4 {
            display: none;
        }

        @media (max-width: 1000px) {
            #img1 {
                display: none;
            }

            #img2 {
                display: block;
            }
        }

        @media (max-width: 700px) {
            #img2 {
                display: none;
            }

            #img3 {
                display: block;
            }
        }

        @media (max-width: 500px) {
            #img3 {
                display: none;
            }

            #img4 {
                display: block;
            }
        }
    </style>
</head>

<body>

    <img id="img1" src="sk.jpg">
    <img id="img2" src="sildate.jpg">
    <img id="img3" src="output.jpg">
    <img id="img4" src="sky.png">

</body>
</html>
