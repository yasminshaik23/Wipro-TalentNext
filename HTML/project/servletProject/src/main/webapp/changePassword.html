<!DOCTYPE html>
<html>

<head>
    <title>Change Password</title>

    <script type="text/javascript">

        function validatePassword() {

            var newPassword =
                document.getElementById("newPassword").value;

            var confirmPassword =
                document.getElementById("confirmPassword").value;

            // Check password requirements
            var pattern =
                /^(?=.*[0-9])(?=.*[A-Z]).{6,}$/;

            if (!pattern.test(newPassword)) {

                alert(
                    "New password must contain at least 6 characters, " +
                    "one uppercase letter and one number"
                );

                return false;
            }

            // Check matching passwords
            if (newPassword != confirmPassword) {

                alert(
                    "New Password and Confirm Password must match"
                );

                return false;
            }

            return true;
        }

    </script>

</head>

<body>

<center>

    <h2>Change Password</h2>

    <form action="/servletProject/changePassword"
          method="post"
          onsubmit="return validatePassword()">

        <table cellpadding="5">

            <tr>
                <td>User ID:</td>

                <td>
                    <input type="text"
                           name="userid"
                           required>
                </td>
            </tr>

            <tr>
                <td>Old Password:</td>

                <td>
                    <input type="password"
                           name="oldPassword"
                           required>
                </td>
            </tr>

            <tr>
                <td>New Password:</td>

                <td>
                    <input type="password"
                           id="newPassword"
                           name="newPassword"
                           required>
                </td>
            </tr>

            <tr>
                <td>Confirm Password:</td>

                <td>
                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           required>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">

                    <input type="submit"
                           value="Change Password">

                    <input type="reset"
                           value="Reset">

                </td>
            </tr>

        </table>

    </form>

    <br>

    <a href="login.html">
        Back to Login
    </a>

</center>

</body>

</html>
