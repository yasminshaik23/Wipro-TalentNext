<!DOCTYPE html>
<html>
<head>
    <title>Online Auction - Place Bid</title>
</head>

<body>

    <h1>Place Your Bid</h1>

    <form action="bid" method="post">

        <label>Item ID:</label>
        <input type="text" name="itemId">
        <br><br>

        <label>Item Name:</label>
        <input type="text" name="itemName">
        <br><br>

        <label>Your Name:</label>
        <input type="text" name="bidderName">
        <br><br>

        <label>Email:</label>
        <input type="text" name="email">
        <br><br>

        <label>Amount Bid:</label>
        <input type="text" name="bidAmount">
        <br><br>

        <label>
            <input type="checkbox" name="autoIncrement" value="Yes">
            Auto Increment
        </label>

        <br><br>

        <input type="submit" value="Place Bid">

    </form>

</body>
</html>
