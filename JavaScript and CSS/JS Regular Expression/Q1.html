<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>

    <script>
        function validateForm() {

            let memberNumber = document.getElementById("memberNumber").value;
            let password = document.getElementById("password").value;

            if (memberNumber === "") {
                alert("Member number must be entered");
                document.getElementById("memberNumber").focus();
                return false;
            }

            if (isNaN(memberNumber)) {
                alert("Member number must be a number");
                document.getElementById("memberNumber").focus();
                return false;
            }

            if (password === "") {
                alert("Password must be entered");
                document.getElementById("password").focus();
                return false;
            }

            if (password.length <= 4) {
                alert("Password must be longer than 4 characters");
                document.getElementById("password").focus();
                return false;
            }

            alert("Form submitted successfully");
            return true;
        }
    </script>

</head>

<body>

    <form onsubmit="return validateForm()">

        Member Number:
        <input type="text" id="memberNumber">

        <br><br>

        Password:
        <input type="password" id="password">

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
