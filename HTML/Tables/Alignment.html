<!DOCTYPE html>
<html>
<head>
    <title>Alignment</title>
</head>
<body>

    <p align="left">
        This text is aligned to the left.
    </p>

    <p align="center">
        This text is aligned to the center.
    </p>

    <p align="right">
        This text is aligned to the right.
    </p>

    <p align="justify">
        This text is justified. This demonstrates how text can be
        aligned equally along both the left and right sides.
    </p>

</body>
</html>
