<!DOCTYPE html>
<html>
<head>
    <title>Text Colors</title>

    <style>
        h1 {
            color: red;
        }

        h2 {
            color: blue;
        }

        p {
            color: green;
        }

        div {
            color: purple;
        }
    </style>
</head>

<body>

    <h1>Red Heading</h1>

    <h2>Blue Heading</h2>

    <p>Green Paragraph</p>

    <div>Purple Div Text</div>

</body>
</html>
