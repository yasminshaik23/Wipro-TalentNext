<!DOCTYPE html>
<html>
<head>
    <title>Lists</title>
</head>
<body>

    <h2>Ordered List</h2>

    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Orange</li>
    </ol>

    <h2>Unordered List</h2>

    <ul>
        <li>Java</li>
        <li>Python</li>
        <li>HTML</li>
        <li>CSS</li>
    </ul>

</body>
</html>
