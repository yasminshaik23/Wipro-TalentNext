<!DOCTYPE html>
<html>
<head>
    <title>Background Position</title>

    <style>
        body {
            background-image: url("sky.png");
            background-position: right top;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>

    <h1>Background Image</h1>
    <p>This image is positioned at the right top.</p>

</body>
</html>
