<!DOCTYPE html>
<html>
<head>
    <title>Different Background Colors</title>

    <style>
        h1 {
            background-color: yellow;
        }

        p {
            background-color: lightblue;
        }

        div {
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h1>This is Heading</h1>

    <p>This is a paragraph.</p>

    <div>This is a div element.</div>

</body>
</html>
